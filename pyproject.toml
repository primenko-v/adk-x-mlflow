[project]
name = "mlflow-adk"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "gitpython>=3.1",
    "google-adk",
    "google-genai",
    "mlflow>=3.6.0",
    "opentelemetry-exporter-otlp-proto-http",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.67.3",
    "pandas>=2.3.3",
    "google-cloud-aiplatform>=1.153.1",
]

[tool.uv.sources]
google-adk = { path = "vendor/google-adk", editable = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlflow_adk"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 88
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: no external dependencies",
    "integration: requires real API/credentials",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::UserWarning:google.*",
]
